services:
  - type: web
    name: gtm-signal-hub-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        value: sqlite:///./gtm_signal_hub.db
      - key: CLAY_WEBHOOK_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
